name: Deploy One Small Step

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create deployment archive
        run: |
          tar -czf "$RUNNER_TEMP/one-small-step.tar.gz" \
            --exclude='.git' \
            --exclude='.github' \
            .

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload deployment archive
        run: |
          scp \
            scp \
              -i ~/.ssh/deploy_key \
              "$RUNNER_TEMP/one-small-step.tar.gz" \
              deploy@${{ secrets.DEPLOY_HOST }}:/home/deploy/deployments/

      - name: Deploy
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            deploy@${{ secrets.DEPLOY_HOST }} \
            'sudo /usr/local/sbin/deploy-one-small-step /home/deploy/deployments/one-small-step.tar.gz'

      - name: Cleanup remote archive
        if: success()
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            deploy@${{ secrets.DEPLOY_HOST }} \
            'rm -f /home/deploy/deployments/one-small-step.tar.gz'
